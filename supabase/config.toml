# Supabase CLI config — commit this file; it contains no secrets.
# Obtain your project_id from: Supabase Dashboard -> Project Settings -> General

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://localhost:5173/reset-password**",
  "com.faunawatch.app://login-callback/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

# The branded emails (see supabase/templates/README.md). Hosted sends through
# Brevo (custom SMTP), so it uses the same files: paste each one into
# Dashboard > Authentication > Emails > Templates whenever it changes.
[auth.email.template.recovery]
subject = "Reset your FaunaWatch password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You're invited to FaunaWatch Admin"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirm your FaunaWatch email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new FaunaWatch email"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enabled = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

# send-push is called by a Database Webhook with its own shared secret header
# (x-webhook-secret), not a Supabase user JWT.
[functions.send-push]
verify_jwt = false

# Same for send-suspension-email (Database Webhook on user_sanctions).
[functions.send-suspension-email]
verify_jwt = false

# Same for send-account-deletion-email (Database Webhook on account_deletions)
# and purge-deleted-accounts (hourly Supabase Cron job).
[functions.send-account-deletion-email]
verify_jwt = false

[functions.purge-deleted-accounts]
verify_jwt = false
